name: Publish to PyPI

# Runs when a GitHub release is published (not on a bare tag push)
on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    name: Build and check distribution
    # Only publish from bge-barcoding, and only for v* tags
    if: github.repository == 'bge-barcoding/gene_fetch' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install package and build tools
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest build twine

    - name: Check release tag matches package version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'EOF'
        import importlib.metadata as md
        import os
        import gene_fetch
        tag_version = os.environ["TAG"].removeprefix("v")
        pyproject_version = md.version("gene-fetch")
        init_version = gene_fetch.__version__
        if not (tag_version == pyproject_version == init_version):
            raise SystemExit(
                f"Version mismatch: tag {tag_version}, pyproject.toml {pyproject_version}, "
                f"src/gene_fetch/__init__.py {init_version}"
            )
        print(f"✓ Releasing version {tag_version}")
        EOF

    - name: Run tests
      run: pytest

    - name: Build sdist and wheel
      run: python -m build

    - name: Check distribution metadata
      run: twine check --strict dist/*

    - name: Upload distribution
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name entered in the PyPI trusted publisher settings
    environment:
      name: pypi
      url: https://pypi.org/project/gene-fetch/
    permissions:
      id-token: write  # Required for PyPI trusted publishing
    steps:
    - name: Download distribution
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
